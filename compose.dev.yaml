# Lokalny development: baza i Mailpit (aplikacja przez `pnpm dev` na hoście).
# Mailpit łapie maile z linkami logowania: SMTP 127.0.0.1:55026, skrzynka http://localhost:55025.
# Start: `pnpm db:up`, stop: `pnpm db:down`. Dane w wolumenie zapisy-dev-db.
name: zapisy-dev

services:
  db:
    image: postgres:18-alpine
    container_name: zapisy-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zapisy
      POSTGRES_PASSWORD: zapisy
      POSTGRES_DB: zapisy
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapisy -d zapisy"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit
    container_name: zapisy-dev-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:55025:8025"
      - "127.0.0.1:55026:1025"

volumes:
  db:
    name: zapisy-dev-db
