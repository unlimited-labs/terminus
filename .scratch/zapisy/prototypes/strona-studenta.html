<!doctype html>
<!--
  PROTOTYP — do wyrzucenia. Zadanie: .scratch/zapisy/issues/09-strona-studenta.md
  Trzy warianty strony /z/<uuid>, przełączane w #v=A|B|C, scenariusze w #s=...
  Aplikacji jeszcze nie ma, więc zamiast trasy TanStack Start jest jeden plik
  (otwierany z dysku; hash zamiast ?variant=, bo file:// nie pozwala na replaceState).
  Losowanie symulowane w pamięci; w aplikacji dzieje się na serwerze pod blokadą.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prototyp: strona studenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F5F3;
    --surface: #FFFFFF;
    --ink: #14231D;
    --muted: #56665F;
    --line: #CFD9D4;
    --taken: #DDE8E2;
    --accent: #0B6E4F;
    --accent-deep: #084F39;
    --warn: #A4262C;
    --warn-bg: #FBECEC;
    --radius-s: 6px;
    --radius-l: 14px;
    font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); padding-bottom: 96px; }
  .num { font-variant-numeric: tabular-nums; }
  h1 { font-size: 1.6rem; line-height: 1.15; margin: 0 0 .25rem; font-weight: 800; letter-spacing: -.01em; }
  h2 { font-size: 1.15rem; margin: 0 0 .75rem; font-weight: 800; }
  p { margin: 0 0 .75rem; }
  .muted { color: var(--muted); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .btn { border: 0; border-radius: var(--radius-s); padding: .7rem 1.1rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-quiet { background: transparent; color: var(--accent); padding-left: 0; padding-right: 0; text-decoration: underline; text-underline-offset: 3px; }
  .btn-block { width: 100%; }

  .field { display: grid; gap: .25rem; margin-bottom: .6rem; }
  .field label { font-size: .85rem; color: var(--muted); }
  .field input { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: .6rem .7rem; width: 100%; }
  .field input[aria-invalid="true"] { border-color: var(--warn); background: var(--warn-bg); }
  .member { border-top: 1px solid var(--line); padding-top: .75rem; margin-top: .75rem; }
  .member:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .member-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .4rem; font-weight: 600; }
  .row2 { display: grid; grid-template-columns: 9rem 1fr; gap: .6rem; }
  @media (max-width: 420px) { .row2 { grid-template-columns: 1fr; gap: 0; } }

  .msg { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: .7rem .9rem; border-radius: 0 var(--radius-s) var(--radius-s) 0; margin-bottom: 1rem; }
  .msg strong { display: block; }
  .msg.info { border-color: var(--accent); background: #E6F2EC; }

  details.rodo { font-size: .85rem; color: var(--muted); margin-top: 1rem; }
  details.rodo summary { cursor: pointer; color: var(--ink); }
  details.rodo ol { padding-left: 1.2rem; margin: .5rem 0 0; }
  details.rodo li { margin-bottom: .3rem; }

  /* bilet z wynikiem — jedyne "głośne" miejsce */
  .ticket { background: var(--accent); color: #fff; border-radius: var(--radius-l); padding: 1.25rem 1.25rem 1rem; position: relative; overflow: hidden; }
  .ticket .day { font-size: 1.05rem; font-weight: 600; opacity: .9; }
  .ticket .time { font-size: 3.4rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; margin: .2rem 0 .6rem; }
  .ticket .place { opacity: .9; margin-bottom: .9rem; }
  .ticket .team { border-top: 1px dashed rgba(255,255,255,.5); padding-top: .7rem; font-size: .95rem; }
  .ticket .team div { display: flex; justify-content: space-between; gap: 1rem; }
  .ticket .team span:last-child { opacity: .8; }
  .reveal { animation: reveal .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes reveal { from { clip-path: inset(0 0 100% 0); transform: translateY(8px); } to { clip-path: inset(0 0 0 0); transform: none; } }
  .drawing { display: grid; place-items: center; min-height: 11rem; border: 2px dashed var(--line); border-radius: var(--radius-l); color: var(--muted); text-align: center; padding: 1rem; }
  .drawing .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .reveal, .drawing .dots::after, .pulse { animation: none !important; } }

  /* harmonogram jako lista (A, C) */
  .day-block { margin-bottom: 1.25rem; }
  .day-block h3 { font-size: 1rem; margin: 0 0 .4rem; display: flex; justify-content: space-between; }
  .slot-row { display: grid; grid-template-columns: 6.2rem 1fr; gap: .75rem; padding: .45rem .6rem; border-bottom: 1px solid var(--line); background: var(--surface); }
  .slot-row:first-of-type { border-radius: var(--radius-s) var(--radius-s) 0 0; }
  .slot-row:last-child { border-bottom: 0; border-radius: 0 0 var(--radius-s) var(--radius-s); }
  .slot-row.free .who { color: var(--accent); font-weight: 600; }
  .slot-row.past { background: transparent; color: var(--muted); }
  .slot-row.past.free .who { color: var(--muted); font-weight: 400; }
  .slot-row.mine { outline: 3px solid var(--accent); outline-offset: -3px; }

  /* plansza (B) */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .board h3 { font-size: .9rem; margin: 0 0 .3rem; }
  .cell { border-radius: var(--radius-s); padding: .35rem .45rem; margin-bottom: 6px; font-size: .82rem; min-height: 3.1rem; border: 1.5px solid var(--line); background: var(--surface); }
  .cell .t { font-weight: 800; }
  .cell .n { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.taken { background: var(--taken); border-color: var(--taken); }
  .cell.free { border-style: dashed; border-color: var(--accent); color: var(--accent); }
  .cell.past { background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(20,35,29,.06) 6px 8px); color: var(--muted); border-color: var(--line); border-style: solid; }
  .cell.mine { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pulse { animation: pulse 1.2s ease-out 2; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(11,110,79,.6); } 100% { box-shadow: 0 0 0 12px rgba(11,110,79,0); } }
  .legend { display: flex; flex-wrap: wrap; gap: .9rem; font-size: .8rem; color: var(--muted); margin: .5rem 0 1rem; }
  .legend i { display: inline-block; width: .9rem; height: .9rem; border-radius: 3px; vertical-align: -2px; margin-right: .3rem; border: 1.5px solid var(--line); }
  .sheet-open-btn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 78px; z-index: 5; box-shadow: 0 6px 18px rgba(8,79,57,.35); }
  .sheet { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-radius: var(--radius-l) var(--radius-l) 0 0; box-shadow: 0 -10px 30px rgba(20,35,29,.18); max-height: 82vh; overflow: auto; padding: 16px 16px 96px; }
  .sheet .inner { max-width: 640px; margin: 0 auto; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }

  /* zakładki i kroki (C) */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: var(--radius-s); padding: 4px; margin: 1rem 0 1.25rem; border: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; padding: .55rem; border-radius: 4px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  .steps { display: flex; gap: .4rem; margin-bottom: 1rem; }
  .steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .steps span.on { background: var(--accent); }
  .size-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(4.5rem, 1fr)); gap: .6rem; margin-bottom: 1rem; }
  .size-pick button { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: .9rem .5rem; cursor: pointer; font-size: 1.4rem; font-weight: 800; }
  .size-pick button small { display: block; font-size: .75rem; font-weight: 400; color: var(--muted); }
  .size-pick button[aria-pressed="true"] { border-color: var(--accent); background: #E6F2EC; }
  .summary { background: var(--surface); border-radius: var(--radius-s); padding: .8rem 1rem; margin-bottom: 1rem; }
  .summary div { display: flex; justify-content: space-between; padding: .2rem 0; }
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

  /* pasek prototypu — celowo obcy stylistycznie */
  #proto { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; display: flex; gap: 8px; align-items: center; background: #000; color: #fff; padding: 6px 8px; border-radius: 999px; font: 13px/1.2 system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.4); max-width: calc(100vw - 16px); }
  #proto button { background: #333; border: 0; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
  #proto select { background: #222; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 4px; max-width: 150px; }
  #proto .lbl { white-space: nowrap; }
  #proto .hint { cursor: help; text-decoration: underline dotted; }
  #state { position: fixed; right: 8px; top: 8px; z-index: 50; background: rgba(0,0,0,.85); color: #9f9; font: 11px/1.3 ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; max-width: 260px; white-space: pre-wrap; display: none; }
  body.show-state #state { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<pre id="state"></pre>
<div id="proto">
  <button data-proto="prev" aria-label="Poprzedni wariant">←</button>
  <span class="lbl" id="proto-label"></span>
  <button data-proto="next" aria-label="Następny wariant">→</button>
  <select id="proto-scenario" aria-label="Scenariusz"></select>
  <span class="hint" title="Na liście: 412301–412360. Zapisani już: 412301 oraz 412331–412345. Każdy inny numer jest spoza listy. Klawisz S pokazuje stan.">?</span>
</div>

<script>
// ---------- dane udawane ----------
const NOW = new Date(2026, 9, 14, 10, 5); // środa 14.10.2026, 10:05
const DAYS = [new Date(2026, 9, 13), new Date(2026, 9, 14), new Date(2026, 9, 16)];
const DAY_NAMES = ["niedziela", "poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota"];
const SLOT_MIN = 20, START_H = 9, COUNT = 9;
const ALLOWED = new Set(Array.from({ length: 60 }, (_, i) => String(412301 + i)));
const RODO = [
  "Administratorem Pani/Pana danych osobowych jest Akademia Górniczo-Hutnicza im. Stanisława Staszica w Krakowie, al. A. Mickiewicza 30, 30-059 Kraków;",
  "dane kontaktowe Inspektora Ochrony Danych Osobowych dostępne są w sekcji „Kontakt” na stronie internetowej agh.edu.pl/uczelnia/kontakt, e-mail: iodo(at)agh.edu.pl, tel.: 12 617 53 25;",
  "Pani/Pana dane osobowe (numer albumu, imię i nazwisko) przetwarzane będą w celu organizacji zaliczenia, w tym przydziału terminu zaliczenia, w ramach realizacji procesu kształcenia na studiach, w trybie art. 6 ust. 1 lit. c RODO, na podstawie Ustawy z dnia 20 lipca 2018 r. Prawo o szkolnictwie wyższym i nauce;",
  "imię i nazwisko osoby zapisanej wraz z przydzielonym terminem są widoczne dla każdej osoby, która ma link do zaliczenia; numer albumu nie jest ujawniany;",
  "odbiorcą Pani/Pana danych osobowych mogą być podmioty uprawnione do ich uzyskania na podstawie przepisów prawa lub podmioty prowadzące wsparcie technologiczne dla systemów informatycznych, w których przetwarzane są Pani/Pana dane osobowe;",
  "Pani/Pana dane osobowe będą przetwarzane przez okres niezbędny do organizacji i przeprowadzenia zaliczenia, do czasu usunięcia zaliczenia przez prowadzącego;",
  "posiada Pani/Pan prawo do żądania od Administratora dostępu do swoich danych oraz prawo ich sprostowania, prawo do przenoszenia danych, prawo ograniczenia przetwarzania danych w przypadkach i na warunkach określonych w RODO;",
  "przysługuje Panu/Pani prawo wniesienia skargi do organu nadzorczego – Prezesa Urzędu Ochrony Danych Osobowych w trybie art. 77 RODO;",
  "Pani/Pana dane osobowe nie będą podlegały profilowaniu; termin zaliczenia jest przydzielany losowo i może zostać zmieniony przez prowadzącego;",
  "Pani/Pana dane osobowe nie będą przekazywane państwom trzecim;",
  "podanie danych osobowych jest warunkiem zapisu na zaliczenie przez tę aplikację."
];

function seedTeams() {
  // klucz: "dzień-slot" -> [[indeks, imię i nazwisko], ...]
  return {
    "0-0": [["412301", "Anna Kowalska"]],
    "0-1": [["412331", "Jan Nowak"], ["412332", "Ola Wiśniewska"]],
    "0-3": [["412333", "Paweł Dąbrowski"]],
    "0-6": [["412334", "Zofia Mazur"], ["412335", "Igor Krawczyk"], ["412336", "Natalia Piotrowska"]],
    "1-0": [["412337", "Piotr Zieliński"]],
    "1-2": [["412338", "Kasia Lewandowska"], ["412339", "Michał Wójcik"], ["412340", "Ewa Kamińska"]],
    "1-4": [["412341", "Tomasz Kaczmarek"]],
    "1-6": [["412342", "Julia Grabowska"], ["412343", "Adam Pawłowski"]],
    "2-0": [["412344", "Marta Michalska"]],
    "2-3": [["412345", "Kamil Nowicki"]]
  };
}

const SCENARIOS = {
  swiezy: "Świeże wejście, zespół do 3",
  indywidualne: "Świeże wejście, zaliczenie indywidualne",
  pelne: "Brak wolnych slotów już przy wejściu",
  losowanie: "Losowanie w toku",
  wynik: "Wynik losowania",
  spoza: "Błąd: indeks spoza listy",
  zajety: "Błąd: indeks ma już zapis",
  brak: "Błąd: skończyły się sloty przy wysyłaniu",
  limit: "Błąd: limit prób"
};
const VARIANTS = { A: "Formularz na górze", B: "Plansza + wysuwany formularz", C: "Zakładki i kroki" };

// ---------- stan ----------
let S;
function reset(scenario) {
  S = {
    scenario,
    maxTeam: scenario === "indywidualne" ? 1 : 3,
    teams: seedTeams(),
    members: [{ index: "", name: "" }],
    phase: "form",       // form | drawing | result
    error: null,         // { kind, index?, slot? }
    fails: 0,
    result: null,        // klucz slotu
    sheetOpen: false,    // B
    tab: "zapis",        // C
    step: 1              // C
  };
  if (S.maxTeam === 1) S.step = 2;
  if (scenario === "pelne") fillAll();
  if (scenario === "losowanie") { S.members = [{ index: "412302", name: "Wiktor Szymański" }, { index: "412303", name: "Lena Woźniak" }]; S.phase = "drawing"; S.sheetOpen = true; S.step = 3; }
  if (scenario === "wynik") { S.members = [{ index: "412302", name: "Wiktor Szymański" }, { index: "412303", name: "Lena Woźniak" }]; S.teams["2-5"] = S.members.map(m => [m.index, m.name]); S.result = "2-5"; S.phase = "result"; S.sheetOpen = true; }
  if (scenario === "spoza") { S.members = [{ index: "412302", name: "Wiktor Szymański" }, { index: "421302", name: "Lena Woźniak" }]; S.error = { kind: "spoza", index: "421302" }; S.sheetOpen = true; S.step = 2; }
  if (scenario === "zajety") { S.members = [{ index: "412301", name: "Anna Kowalska" }]; S.error = { kind: "zajety", index: "412301", slot: "0-0" }; S.sheetOpen = true; S.step = 2; }
  if (scenario === "brak") { fillAll(); S.members = [{ index: "412302", name: "Wiktor Szymański" }]; S.error = { kind: "brak" }; S.sheetOpen = true; S.step = 2; }
  if (scenario === "limit") { S.members = [{ index: "499999", name: "Test Testowy" }]; S.error = { kind: "limit" }; S.fails = 10; S.sheetOpen = true; S.step = 2; }
}
function fillAll() {
  eachSlot((key, start) => { if (!S.teams[key] && start > NOW) S.teams[key] = [["4129" + key.replace("-", ""), "Zapisany Student"]]; });
}

// ---------- pomocnicze ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
function slotStart(key) { const [d, i] = key.split("-").map(Number); const t = new Date(DAYS[d]); t.setHours(START_H, i * SLOT_MIN); return t; }
function hm(date) { return date.getHours() + ":" + pad(date.getMinutes()); }
function slotTime(key) { const s = slotStart(key); return hm(s) + "–" + hm(new Date(s.getTime() + SLOT_MIN * 60000)); }
function dayLabel(d) { return DAY_NAMES[d.getDay()] + " " + d.getDate() + "." + pad(d.getMonth() + 1); }
function eachSlot(fn) { DAYS.forEach((day, d) => { for (let i = 0; i < COUNT; i++) { const key = d + "-" + i; fn(key, slotStart(key), d, i); } }); }
function enrolled() { const m = new Map(); for (const [k, t] of Object.entries(S.teams)) for (const [idx] of t) m.set(idx, k); return m; }
function freeFuture() { const out = []; eachSlot((k, st) => { if (!S.teams[k] && st > NOW) out.push(k); }); return out; }
function surname(n) { return n.split(" ").slice(-1)[0]; }

// ---------- akcje ----------
function submit() {
  S.error = null;
  if (S.fails >= 10) { S.error = { kind: "limit" }; return render(); }
  for (const m of S.members) {
    if (!/^\d+$/.test(m.index.trim()) || !m.name.trim()) { S.error = { kind: "pola", index: m.index }; return render(); }
  }
  const idxs = S.members.map(m => m.index.trim());
  const dup = idxs.find((x, i) => idxs.indexOf(x) !== i);
  if (dup) { S.error = { kind: "powtorka", index: dup }; return render(); }
  const miss = idxs.find(x => !ALLOWED.has(x));
  if (miss) { S.fails++; S.error = { kind: S.fails >= 10 ? "limit" : "spoza", index: miss }; return render(); }
  const en = enrolled();
  const taken = idxs.find(x => en.has(x));
  if (taken) { S.error = { kind: "zajety", index: taken, slot: en.get(taken) }; return render(); }
  const free = freeFuture();
  if (!free.length) { S.error = { kind: "brak" }; return render(); }
  // najpierw dzień, potem slot w dniu
  const days = [...new Set(free.map(k => k.split("-")[0]))];
  const day = days[Math.floor(Math.random() * days.length)];
  const inDay = free.filter(k => k.startsWith(day + "-"));
  const key = inDay[Math.floor(Math.random() * inDay.length)];
  S.phase = "drawing"; render();
  setTimeout(() => { S.teams[key] = S.members.map(m => [m.index.trim(), m.name.trim()]); S.result = key; S.phase = "result"; render(); }, 900);
}

// ---------- kawałki wspólne ----------
function header() {
  return `<h1>Mechanika płynów — kolokwium zaliczeniowe</h1>
  <p class="muted">Pawilon B-4, sala 214<br>Prowadzący: dr inż. Marek Sowa</p>`;
}
function errorBox() {
  const e = S.error; if (!e) return "";
  const map = {
    spoza: [`Indeksu ${esc(e.index)} nie ma na liście tego zaliczenia.`, "Sprawdź numer. Jeśli jest poprawny, napisz do prowadzącego. Nikogo nie zapisano."],
    zajety: [`Indeks ${esc(e.index)} ma już zapis: ${e.slot ? dayLabel(DAYS[+e.slot.split("-")[0]]) + ", " + slotTime(e.slot) : ""}.`, S.members.length > 1 ? "Nikogo z zespołu nie zapisano. Usuń tę osobę z formularza albo poproś prowadzącego o dopisanie jej do zespołu." : "Slot się nie zmienia. Jeśli chcesz inny, napisz do prowadzącego."],
    brak: ["Brak wolnych slotów.", "Nikogo nie zapisano. Napisz do prowadzącego."],
    limit: ["Za dużo prób z numerami spoza listy.", "Spróbuj ponownie za 10 minut."],
    pola: ["Uzupełnij indeks i imię i nazwisko każdej osoby.", "Indeks to same cyfry."],
    powtorka: [`Indeks ${esc(e.index)} jest wpisany dwa razy.`, ""]
  }[e.kind];
  const cls = e.kind === "zajety" && S.members.length === 1 ? "msg info" : "msg";
  return `<div class="${cls}" role="alert"><strong>${map[0]}</strong>${map[1]}</div>`;
}
function memberFields() {
  return S.members.map((m, i) => {
    const bad = S.error && S.error.index && S.error.index === m.index;
    return `<div class="member">
      ${S.maxTeam > 1 ? `<div class="member-head"><span>Osoba ${i + 1}</span>${S.members.length > 1 ? `<button type="button" class="btn btn-quiet" data-act="remove" data-i="${i}">Usuń</button>` : ""}</div>` : ""}
      <div class="row2">
        <div class="field"><label for="idx${i}">Numer indeksu</label><input id="idx${i}" inputmode="numeric" autocomplete="off" data-i="${i}" data-f="index" value="${esc(m.index)}" aria-invalid="${bad}"></div>
        <div class="field"><label for="nm${i}">Imię i nazwisko</label><input id="nm${i}" autocomplete="name" data-i="${i}" data-f="name" value="${esc(m.name)}"></div>
      </div></div>`;
  }).join("") + (S.members.length < S.maxTeam ? `<button type="button" class="btn btn-quiet" data-act="add">Dodaj osobę do zespołu (${S.members.length}/${S.maxTeam})</button>` : "");
}
function rodo(summaryText) {
  return `<details class="rodo"><summary>${summaryText}</summary><ol>${RODO.map(p => `<li>${p}</li>`).join("")}</ol></details>`;
}
function ticket() {
  const k = S.result, d = DAYS[+k.split("-")[0]];
  return `<div class="ticket reveal" tabindex="-1" id="ticket">
    <div class="day">${dayLabel(d)}</div>
    <div class="time num">${slotTime(k)}</div>
    <div class="place">Pawilon B-4, sala 214</div>
    <div class="team">${S.teams[k].map(([i, n]) => `<div><span>${esc(n)}</span><span class="num">${esc(i)}</span></div>`).join("")}</div>
  </div>
  <p class="muted" style="margin-top:.75rem">Slot jest przydzielony na stałe. Zmianę można uzgodnić tylko z prowadzącym.</p>`;
}
function drawing() {
  return `<div class="drawing" role="status"><div><strong>Losowanie slotu<span class="dots"></span></strong><br><span>Nie zamykaj strony.</span></div></div>`;
}
function scheduleList() {
  return DAYS.map((day, d) => {
    let free = 0; const rows = [];
    for (let i = 0; i < COUNT; i++) {
      const k = d + "-" + i, t = S.teams[k], past = slotStart(k) <= NOW;
      if (!t && !past) free++;
      const who = t ? t.map(x => esc(x[1])).join(", ") : (past ? "nikt" : "wolny");
      rows.push(`<div class="slot-row ${t ? "taken" : "free"} ${past ? "past" : ""} ${k === S.result ? "mine" : ""}" id="row-${k}"><span class="num">${slotTime(k)}</span><span class="who">${who}</span></div>`);
    }
    return `<section class="day-block"><h3><span>${dayLabel(day)}</span><span class="muted num" style="font-weight:400">${free ? "wolne: " + free : "brak wolnych"}</span></h3>${rows.join("")}</section>`;
  }).join("");
}
function fullNotice() {
  return `<div class="msg"><strong>Wszystkie sloty są zajęte.</strong>Zapis nie jest już możliwy. Jeśli nie masz slotu, napisz do prowadzącego.</div>`;
}

// ---------- wariant A: formularz na górze, harmonogram pod spodem ----------
function VariantA() {
  let top;
  if (S.phase === "drawing") top = drawing();
  else if (S.phase === "result") top = ticket();
  else if (!freeFuture().length && !S.error) top = fullNotice();
  else top = `<form data-act="submit" novalidate>
      <h2>${S.maxTeam > 1 ? "Zapisz siebie albo cały zespół" : "Zapisz się"}</h2>
      ${S.maxTeam > 1 ? `<p class="muted">Zespół to do ${S.maxTeam} osób zaliczających razem. Każda osoba z zespołu dostaje ten sam slot.</p>` : ""}
      ${errorBox()}${memberFields()}
      <button class="btn btn-primary btn-block" style="margin-top:1rem">Losuj slot</button>
      ${rodo("Jak przetwarzamy Twoje dane")}
    </form>`;
  return `<div class="wrap">${header()}<div style="margin:1.25rem 0 2rem">${top}</div>
    <h2>Harmonogram</h2>${scheduleList()}</div>`;
}

// ---------- wariant B: plansza slotów, formularz w wysuwanym panelu ----------
function VariantB() {
  const cols = DAYS.map((day, d) => {
    const cells = [];
    for (let i = 0; i < COUNT; i++) {
      const k = d + "-" + i, t = S.teams[k], past = slotStart(k) <= NOW, mine = k === S.result;
      const cls = mine ? "mine pulse" : past ? "past" : t ? "taken" : "free";
      const n = t ? surname(t[0][1]) + (t.length > 1 ? " +" + (t.length - 1) : "") : past ? "" : "wolny";
      const title = t ? t.map(x => x[1]).join(", ") : "";
      cells.push(`<div class="cell ${cls}" title="${esc(title)}"><span class="t num">${hm(slotStart(k))}</span><span class="n">${esc(n)}</span></div>`);
    }
    return `<div><h3>${dayLabel(day)}</h3>${cells.join("")}</div>`;
  }).join("");
  const anyFree = freeFuture().length > 0;
  let sheetBody;
  if (S.phase === "drawing") sheetBody = drawing();
  else if (S.phase === "result") sheetBody = ticket();
  else sheetBody = `<form data-act="submit" novalidate>${errorBox()}${memberFields()}
      <button class="btn btn-primary btn-block" style="margin-top:1rem">Losuj slot</button>
      ${rodo("Dane osobowe: kto i po co")}</form>`;
  return `<div class="wrap">${header()}
    <div class="legend"><span><i style="border-style:dashed;border-color:var(--accent)"></i>wolny</span><span><i style="background:var(--taken);border-color:var(--taken)"></i>zajęty</span><span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(20,35,29,.15) 3px 4px)"></i>minął</span>${S.result ? `<span><i style="background:var(--accent);border-color:var(--accent)"></i>Twój</span>` : ""}</div>
    ${!anyFree && !S.result && !S.error ? fullNotice() : ""}
    <div class="board">${cols}</div></div>
    ${S.sheetOpen ? `<div class="sheet" role="dialog" aria-label="Zapis"><div class="inner">
        <div class="sheet-head"><h2 style="margin:0">${S.phase === "result" ? "Twój slot" : S.maxTeam > 1 ? "Zapis (do " + S.maxTeam + " osób)" : "Zapis"}</h2>
        <button class="btn btn-quiet" data-act="closeSheet">${S.phase === "result" ? "Pokaż na planszy" : "Zamknij"}</button></div>
        ${sheetBody}</div></div>`
      : (anyFree || S.result ? `<button class="btn btn-primary sheet-open-btn" data-act="openSheet">${S.result ? "Twój slot" : "Zapisz się"}</button>` : "")}`;
}

// ---------- wariant C: dwie zakładki, zapis w krokach ----------
function VariantC() {
  const tabs = `<div class="tabs" role="tablist">
    <button role="tab" aria-selected="${S.tab === "zapis"}" data-act="tab" data-tab="zapis">${S.result ? "Twój slot" : "Zapis"}</button>
    <button role="tab" aria-selected="${S.tab === "harm"}" data-act="tab" data-tab="harm">Harmonogram</button></div>`;
  if (S.tab === "harm") return `<div class="wrap">${header()}${tabs}${scheduleList()}</div>`;
  let body;
  const steps = S.maxTeam > 1 ? 3 : 2, cur = S.maxTeam > 1 ? S.step : S.step - 1;
  const bar = `<div class="steps">${Array.from({ length: steps }, (_, i) => `<span class="${i < cur ? "on" : ""}"></span>`).join("")}</div>`;
  if (S.phase === "drawing") body = drawing();
  else if (S.phase === "result") body = ticket() + `<button class="btn btn-quiet" data-act="tab" data-tab="harm">Zobacz w harmonogramie</button>`;
  else if (!freeFuture().length && !S.error) body = fullNotice();
  else if (S.step === 1) {
    body = `${bar}<h2>Ile osób zalicza razem?</h2>
      <div class="size-pick">${Array.from({ length: S.maxTeam }, (_, i) => `<button aria-pressed="${S.members.length === i + 1}" data-act="size" data-n="${i + 1}">${i + 1}<small>${i === 0 ? "tylko ja" : "osoby"}</small></button>`).join("")}</div>
      <p class="muted">Cały zespół dostaje jeden slot. Kto zapisze się później, wylosuje osobny.</p>
      <div class="nav"><span></span><button class="btn btn-primary" data-act="step" data-to="2">Dalej</button></div>`;
  } else if (S.step === 2) {
    body = `${bar}<h2>${S.members.length > 1 ? "Dane osób z zespołu" : "Twoje dane"}</h2>${errorBox()}
      <form data-act="toStep3" novalidate>${S.members.map((m, i) => `<div class="member">${S.members.length > 1 ? `<div class="member-head"><span>Osoba ${i + 1}</span></div>` : ""}
        <div class="row2"><div class="field"><label for="idx${i}">Numer indeksu</label><input id="idx${i}" inputmode="numeric" data-i="${i}" data-f="index" value="${esc(m.index)}" aria-invalid="${!!(S.error && S.error.index === m.index)}"></div>
        <div class="field"><label for="nm${i}">Imię i nazwisko</label><input id="nm${i}" data-i="${i}" data-f="name" value="${esc(m.name)}"></div></div></div>`).join("")}
      <div class="nav" style="margin-top:1rem">${S.maxTeam > 1 ? `<button type="button" class="btn btn-quiet" data-act="step" data-to="1">Wstecz</button>` : "<span></span>"}<button class="btn btn-primary">Dalej</button></div></form>`;
  } else {
    body = `${bar}<h2>Sprawdź i losuj</h2>
      <div class="summary">${S.members.map(m => `<div><span>${esc(m.name)}</span><span class="num muted">${esc(m.index)}</span></div>`).join("")}</div>
      <p class="muted">Po losowaniu slotu nie da się zmienić samodzielnie. Imiona i nazwiska będą widoczne w harmonogramie dla każdego, kto ma link.</p>
      ${rodo("Pełna informacja o przetwarzaniu danych")}
      <div class="nav" style="margin-top:1rem"><button class="btn btn-quiet" data-act="step" data-to="2">Popraw dane</button><button class="btn btn-primary" data-act="submitC">Losuj slot</button></div>`;
  }
  return `<div class="wrap">${header()}${tabs}${body}</div>`;
}

// ---------- przełącznik i renderowanie ----------
const VKEYS = Object.keys(VARIANTS);
let variant = "A";
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  variant = VKEYS.includes(h.get("v")) ? h.get("v") : "A";
  const s = SCENARIOS[h.get("s")] ? h.get("s") : "swiezy";
  if (!S || S.scenario !== s) reset(s);
}
function writeHash() { location.hash = "v=" + variant + "&s=" + S.scenario; }
function render() {
  document.getElementById("app").innerHTML = { A: VariantA, B: VariantB, C: VariantC }[variant]();
  document.getElementById("proto-label").textContent = variant + " — " + VARIANTS[variant];
  document.getElementById("proto-scenario").value = S.scenario;
  document.getElementById("state").textContent = JSON.stringify({ wariant: variant, faza: S.phase, blad: S.error, wynik: S.result, proby: S.fails, osoby: S.members, krok: S.step, wolne: freeFuture().length }, null, 1);
  if (S.phase === "result") { const t = document.getElementById("ticket"); if (t) t.focus({ preventScroll: false }); }
}
const sel = document.getElementById("proto-scenario");
sel.innerHTML = Object.entries(SCENARIOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
sel.addEventListener("change", () => { reset(sel.value); writeHash(); render(); });
function cycle(d) { variant = VKEYS[(VKEYS.indexOf(variant) + d + VKEYS.length) % VKEYS.length]; writeHash(); render(); }
document.querySelector("[data-proto=prev]").onclick = () => cycle(-1);
document.querySelector("[data-proto=next]").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  const t = e.target; if (t.matches("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  if (e.key === "s" || e.key === "S") document.body.classList.toggle("show-state");
});
window.addEventListener("hashchange", () => { readHash(); render(); });

// ---------- zdarzenia strony ----------
const app = document.getElementById("app");
app.addEventListener("input", e => { const i = e.target.dataset.i, f = e.target.dataset.f; if (f) S.members[+i][f] = e.target.value; });
app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.dataset.act === "submit") submit();
  if (e.target.dataset.act === "toStep3") {
    S.error = null;
    if (S.members.some(m => !/^\d+$/.test(m.index.trim()) || !m.name.trim())) { S.error = { kind: "pola" }; return render(); }
    S.step = 3; render();
  }
});
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "FORM") return;
  const a = b.dataset.act;
  if (a === "add") { S.members.push({ index: "", name: "" }); render(); document.getElementById("idx" + (S.members.length - 1)).focus(); }
  if (a === "remove") { S.members.splice(+b.dataset.i, 1); render(); }
  if (a === "openSheet") { S.sheetOpen = true; render(); }
  if (a === "closeSheet") { S.sheetOpen = false; render(); }
  if (a === "tab") { S.tab = b.dataset.tab; render(); }
  if (a === "size") { const n = +b.dataset.n; while (S.members.length < n) S.members.push({ index: "", name: "" }); S.members.length = n; render(); }
  if (a === "step") { S.step = +b.dataset.to; S.error = null; render(); }
  if (a === "submitC") { submit(); if (S.error) { S.step = 2; render(); } }
});

readHash(); render();
</script>
</body>
</html>
