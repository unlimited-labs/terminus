<!doctype html>
<!--
  PROTOTYP — do wyrzucenia. Zadanie: .scratch/zapisy/issues/10-tablica-zapisow-prowadzacego.md
  Trzy warianty tablicy zapisów, przełączane w #v=A|B|C. Stan tylko w pamięci.
  Aplikacji jeszcze nie ma, więc jeden plik: React 19 + @dnd-kit/react 0.5.0 z esm.sh,
  JSX zastąpiony przez htm. Wymaga internetu (moduły z CDN).
  Sprawdza przy okazji otwarte punkty z researchu: useDraggable + useDroppable na tym
  samym elemencie (kafelek i slot), zamianę w onDragEnd, obsługę klawiatury.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp: tablica zapisów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.1.0",
    "react/jsx-runtime": "https://esm.sh/react@19.1.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.1.0",
    "react-dom/client": "https://esm.sh/react-dom@19.1.0/client",

<style>
  :root {
    --paper: #F2F5F3; --surface: #fff; --ink: #14231D; --muted: #56665F; --line: #CFD9D4;
    --tile: #E7EFEA; --accent: #0B6E4F; --accent-soft: #D6EBE1; --warn: #A4262C; --warn-soft: #FBECEC;
    font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; font-size: 15px; line-height: 1.35; color: var(--ink);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); padding-bottom: 70px; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  h1 { font-size: 1.35rem; margin: 0; font-weight: 800; }
  .top { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: end; padding: 16px 20px 12px; }
  .top .stats { display: flex; gap: 1.5rem; }
  .top .stats b { display: block; font-size: 1.3rem; }
  .top .stats span { font-size: .8rem; color: var(--muted); }
  .warnline { color: var(--warn); font-size: .85rem; }
  .search { border: 1.5px solid var(--line); border-radius: 6px; padding: .45rem .6rem; min-width: 16rem; background: var(--surface); }

  /* kafelek osoby */
  .tile { display: flex; align-items: center; gap: .4rem; background: var(--tile); border-radius: 5px; padding: .3rem .4rem; margin-top: 4px; cursor: grab; touch-action: none; border: 1.5px solid transparent; min-width: 0; }
  .tile .idx { font-size: .75rem; color: var(--muted); }
  .tile .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .ed { border: 0; background: transparent; cursor: pointer; opacity: .55; padding: 0 .2rem; }
  .tile .ed:hover { opacity: 1; }
  .tile.drop { border-color: var(--accent); background: var(--accent-soft); }
  .tile.dragging { opacity: .5; }
  .tile.hit { outline: 3px solid #E0A800; }
  .tile input { width: 100%; border: 1px solid var(--accent); border-radius: 4px; padding: .1rem .3rem; }

  /* slot */
  .slot { background: var(--surface); border: 1.5px solid var(--line); border-radius: 7px; padding: .35rem .45rem .45rem; min-height: 3.2rem; }
  .slot-h { display: flex; align-items: center; gap: .35rem; font-size: .82rem; }
  .slot-h .t { font-weight: 800; }
  .slot-h .cap { margin-left: auto; color: var(--muted); }
  .grip { cursor: grab; border: 0; background: transparent; padding: 0 .15rem; color: var(--muted); font-size: 1rem; line-height: 1; touch-action: none; }
  .grip[disabled] { visibility: hidden; }
  .slot.empty { border-style: dashed; }
  .slot.empty .slot-h .t { color: var(--accent); }
  .slot.drop-ok { border-color: var(--accent); background: var(--accent-soft); }
  .slot.drop-bad { border-color: var(--warn); background: var(--warn-soft); }
  .slot.dragging { opacity: .5; }

  /* niezapisani */
  .pool { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: .6rem; }
  .pool.drop-ok { border-color: var(--warn); background: var(--warn-soft); }
  .pool h2 { font-size: 1rem; margin: 0 0 .4rem; display: flex; justify-content: space-between; }
  .pool .tile { background: #fff; border: 1.5px dashed var(--line); }

  /* A: kolumny dni + panel po prawej */
  .A { display: grid; grid-template-columns: 1fr 250px; gap: 16px; padding: 0 20px; align-items: start; }
  .A .days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .A .day h3 { font-size: .95rem; margin: 0 0 .4rem; display: flex; justify-content: space-between; }
  .A .day .slot { margin-bottom: 8px; }
  .A .pool { position: sticky; top: 12px; max-height: calc(100vh - 100px); overflow: auto; }

  /* B: wiersze dni + taca na dole */
  .B { padding: 0 20px 190px; }
  .B .row { margin-bottom: 14px; }
  .B .row h3 { font-size: .95rem; margin: 0 0 .35rem; }
  .B .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .B .strip .slot { flex: 0 0 170px; }
  .B .pool { position: fixed; left: 0; right: 0; bottom: 56px; border-radius: 0; border-width: 1.5px 0 0; max-height: 170px; overflow: auto; z-index: 5; }
  .B .pool .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .B .pool .tile { margin: 0; flex: 0 0 auto; }

  /* C: tabela + akcje */
  .C { display: grid; grid-template-columns: 240px 1fr; gap: 16px; padding: 0 20px; align-items: start; }
  .C .pool { position: sticky; top: 12px; max-height: calc(100vh - 100px); overflow: auto; }
  .C table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
  .C th { text-align: left; font-size: .8rem; color: var(--muted); font-weight: 600; padding: .4rem .6rem; border-bottom: 1.5px solid var(--line); background: var(--paper); }
  .C td { padding: .35rem .6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .C tr.daystart td { border-top: 2px solid var(--ink); }
  .C .team { display: flex; flex-wrap: wrap; gap: 4px; min-height: 2rem; align-items: center; border-radius: 6px; padding: 2px; }
  .C .team .tile { margin: 0; }
  .C .team.drop-ok { background: var(--accent-soft); }
  .C .team.drop-bad { background: var(--warn-soft); }
  .C select { border: 1px solid var(--line); border-radius: 5px; padding: .15rem .2rem; font-size: .8rem; background: #fff; max-width: 9.5rem; }

  /* dialog, toast, pasek prototypu */
  .dlg-bg { position: fixed; inset: 0; background: rgba(20,35,29,.35); display: grid; place-items: center; z-index: 30; }
  .dlg { background: #fff; border-radius: 10px; padding: 1rem 1.2rem; width: min(380px, 92vw); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .dlg h2 { font-size: 1.05rem; margin: 0 0 .6rem; }
  .dlg input { width: 100%; border: 1.5px solid var(--line); border-radius: 6px; padding: .5rem; margin: .2rem 0 .8rem; }
  .row-btns { display: flex; justify-content: flex-end; gap: .5rem; }
  .btn { border: 0; border-radius: 6px; padding: .5rem .9rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; }
  .btn.q { background: transparent; color: var(--accent); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 64px; background: var(--ink); color: #fff; padding: .55rem .8rem; border-radius: 8px; display: flex; gap: 1rem; align-items: center; z-index: 20; max-width: 92vw; }
  .toast.bad { background: var(--warn); }
  .toast button { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: 5px; padding: .2rem .6rem; cursor: pointer; }
  #proto { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 50; display: flex; gap: 8px; align-items: center; background: #000; color: #fff; padding: 6px 8px; border-radius: 999px; font: 13px/1.2 system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #proto button { background: #333; border: 0; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
  #proto .hint { cursor: help; text-decoration: underline dotted; }
  #log { position: fixed; right: 8px; top: 8px; z-index: 50; background: rgba(0,0,0,.85); color: #9f9; font: 11px/1.3 ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; width: 300px; white-space: pre-wrap; }
  #boot { padding: 40px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"><p id="boot">Ładowanie modułów z esm.sh…</p></div>
<script type="module">
import React, { useState, useEffect, useRef } from "react";
import { createRoot } from "react-dom/client";
import { DragDropProvider, useDraggable, useDroppable, useDragOperation } from "@dnd-kit/react";
import htm from "htm";
const html = htm.bind(React.createElement);

// ---------- dane udawane ----------
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const FIRST = ["Anna","Jan","Ola","Piotr","Kasia","Michał","Ewa","Tomasz","Julia","Adam","Marta","Kamil","Zofia","Igor","Natalia","Paweł","Lena","Wiktor","Maja","Filip","Hanna","Oskar","Nina","Bartek"];
const LAST = ["Kowalska","Nowak","Wiśniewska","Zieliński","Lewandowska","Wójcik","Kamińska","Kaczmarek","Grabowska","Pawłowski","Michalska","Nowicki","Mazur","Krawczyk","Piotrowska","Dąbrowski","Woźniak","Szymański","Kozłowska","Jankowski","Wojciechowska","Kwiatkowski","Krajewska","Sowa"];
const DAYS = ["pon 19.10", "wt 20.10", "śr 21.10", "czw 22.10"];
const MAX = 3;
const SLOTS = [];
DAYS.forEach((d, di) => { for (let i = 0; i < 9; i++) { const s = 9 * 60 + i * 20; const f = m => Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); SLOTS.push({ id: di + "-" + i, day: di, time: f(s) + "–" + f(s + 20) }); } });
const LIST = Array.from({ length: 110 }, (_, i) => String(402100 + i));
function initial() {
  const z = {}; let k = 0;
  for (const s of SLOTS) {
    if (rnd() < 0.2) continue;
    const size = 1 + Math.floor(rnd() * MAX);
    for (let j = 0; j < size && k < 70; j++, k++) z[LIST[k]] = { name: FIRST[Math.floor(rnd() * FIRST.length)] + " " + LAST[Math.floor(rnd() * LAST.length)], slot: s.id };
  }
  return z;
}
const team = (z, slotId) => Object.entries(z).filter(([, v]) => v.slot === slotId).map(([idx, v]) => ({ idx, ...v }));
const slotOf = id => SLOTS.find(s => s.id === id);
const label = id => { const s = slotOf(id); return DAYS[s.day] + ", " + s.time; };

// ---------- przełącznik wariantów ----------
const VARIANTS = { A: "Kolumny dni, niezapisani z prawej", B: "Wiersze dni, niezapisani na dole", C: "Tabela z akcjami „Przenieś do…”" };
const readV = () => { const v = new URLSearchParams(location.hash.slice(1)).get("v"); return VARIANTS[v] ? v : "A"; };

// ---------- logika operacji (to samo, co potem w onDragEnd na serwerze) ----------
// zwraca { next, msg } albo { error }
function apply(z, op) {
  const n = structuredClone(z);
  if (op.kind === "person-to-slot") {
    const t = team(z, op.slot);
    if (z[op.idx]?.slot === op.slot) return { next: z };
    if (t.length >= MAX) return { error: "Slot " + label(op.slot) + " jest pełny (" + MAX + " os.). Upuść na osobę, żeby zamienić." };
    if (!z[op.idx]) return { needName: true };
    n[op.idx].slot = op.slot;
    return { next: n, msg: z[op.idx].name + " → " + label(op.slot) };
  }
  if (op.kind === "person-swap") {
    const a = z[op.a], b = z[op.b];
    if (!b) return { next: z };
    if (!a) return { error: "Osobę z listy niezapisanych wstaw na slot z wolnym miejscem, nie na inną osobę." };
    if (a.slot === b.slot) return { next: z };
    n[op.a].slot = b.slot; n[op.b].slot = a.slot;
    return { next: n, msg: "Zamieniono: " + a.name + " ↔ " + b.name };
  }
  if (op.kind === "person-remove") {
    if (!z[op.idx]) return { next: z };
    delete n[op.idx];
    return { next: n, msg: "Usunięto zapis: " + z[op.idx].name + " (" + op.idx + ")" };
  }
  if (op.kind === "team-move") {
    if (op.from === op.to) return { next: z };
    const A = team(z, op.from), B = team(z, op.to);
    for (const p of A) n[p.idx].slot = op.to;
    for (const p of B) n[p.idx].slot = op.from;
    return { next: n, msg: B.length ? "Zamieniono zespoły: " + label(op.from) + " ↔ " + label(op.to) : "Przeniesiono zespół na " + label(op.to) };
  }
  if (op.kind === "manual") {
    if (team(z, op.slot).length >= MAX) return { error: "Slot jest pełny." };
    n[op.idx] = { name: op.name, slot: op.slot };
    return { next: n, msg: "Zapisano ręcznie: " + op.name + " → " + label(op.slot) };
  }
  if (op.kind === "rename") { n[op.idx].name = op.name; return { next: n, msg: "Zmieniono nazwisko" }; }
  return { next: z };
}

// ---------- komponenty wspólne (kafelek, slot, niezapisani) ----------
function Tile({ idx, name, hit, onRename }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(name);
  const drag = useDraggable({ id: "p:" + idx, type: "person", data: { idx }, disabled: editing });
  const drop = useDroppable({ id: "pt:" + idx, accept: "person", data: { idx }, collisionPriority: 3, disabled: !name });
  const ref = el => { drag.ref(el); drop.ref(el); };
  if (editing) return html`<div className="tile"><input autoFocus value=${val} onInput=${e => setVal(e.target.value)}
      onKeyDown=${e => { if (e.key === "Enter" && val.trim()) { onRename(idx, val.trim()); setEditing(false); } if (e.key === "Escape") setEditing(false); }}
      onBlur=${() => setEditing(false)} aria-label="Imię i nazwisko" /></div>`;
  return html`<div ref=${ref} className=${"tile" + (drop.isDropTarget ? " drop" : "") + (drag.isDragging ? " dragging" : "") + (hit ? " hit" : "")}
      title=${name ? name + " (" + idx + ")" : idx}>
    <span className="nm">${name || html`<span className="num">${idx}</span>`}</span>
    ${name && html`<span className="idx num">${idx}</span>`}
    ${name && html`<button className="ed" aria-label=${"Zmień imię i nazwisko: " + name} onPointerDown=${e => e.stopPropagation()} onClick=${() => { setVal(name); setEditing(true); }}>✎</button>`}
  </div>`;
}

function useSlotDnd(slotId, members) {
  const drop = useDroppable({ id: "s:" + slotId, accept: ["person", "team"], data: { slot: slotId }, collisionPriority: 1 });
  const drag = useDraggable({ id: "t:" + slotId, type: "team", data: { slot: slotId }, disabled: members.length === 0 });
  const { source } = useDragOperation();
  let cls = "";
  if (drop.isDropTarget && source) {
    const full = members.length >= MAX;
    const isTeam = source.type === "team";
    const own = source.data?.slot === slotId || members.some(m => m.idx === source.data?.idx);
    cls = own ? "" : (isTeam || !full ? " drop-ok" : " drop-bad");
  }
  return { drop, drag, cls };
}

function Pool({ z, filter, setFilter, hitSet, variant }) {
  const drop = useDroppable({ id: "pool", accept: "person", collisionPriority: 1 });
  const { source } = useDragOperation();
  const out = LIST.filter(i => !z[i]).filter(i => !filter || i.includes(filter));
  const tiles = out.map(i => html`<${Tile} key=${i} idx=${i} name="" hit=${hitSet.has(i)} />`);
  return html`<aside ref=${drop.ref} className=${"pool" + (drop.isDropTarget && source?.type === "person" && z[source.data?.idx] ? " drop-ok" : "")}>
    <h2><span>Niezapisani</span><span className="muted num">${LIST.filter(i => !z[i]).length}</span></h2>
    <p className="muted" style=${{ fontSize: ".8rem", margin: "0 0 .4rem" }}>Upuść tu osobę, żeby usunąć jej zapis. Przeciągnij stąd na slot, żeby zapisać ręcznie.</p>
    <input className="search" style=${{ minWidth: 0, width: "100%", marginBottom: ".3rem" }} placeholder="Szukaj indeksu" value=${filter} onInput=${e => setFilter(e.target.value)} />
    ${variant === "B" ? html`<div className="chips">${tiles}</div>` : tiles}
  </aside>`;
}

// ---------- wariant A ----------
function SlotBox({ s, z, hitSet, onRename }) {
  const members = team(z, s.id);
  const { drop, drag, cls } = useSlotDnd(s.id, members);
  const ref = el => { drop.ref(el); drag.ref(el); };
  return html`<div ref=${ref} className=${"slot" + (members.length ? "" : " empty") + cls + (drag.isDragging ? " dragging" : "")}>
    <div className="slot-h">
      <button ref=${drag.handleRef} className="grip" disabled=${!members.length} aria-label=${"Przenieś cały zespół z " + label(s.id)}>⠿</button>
      <span className="t num">${s.time}</span>
      <span className="cap num">${members.length ? members.length + "/" + MAX : "wolny"}</span>
    </div>
    ${members.map(m => html`<${Tile} key=${m.idx} idx=${m.idx} name=${m.name} hit=${hitSet.has(m.idx)} onRename=${onRename} />`)}
  </div>`;
}
function VariantA(p) {
  return html`<div className="A">
    <div className="days">${DAYS.map((d, di) => {
      const ss = SLOTS.filter(s => s.day === di);
      const free = ss.filter(s => team(p.z, s.id).length === 0).length;
      return html`<section className="day" key=${d}><h3><span>${d}</span><span className="muted num" style=${{ fontWeight: 400 }}>wolne: ${free}</span></h3>
        ${ss.map(s => html`<${SlotBox} key=${s.id} s=${s} ...${p} />`)}</section>`;
    })}</div>
    <${Pool} ...${p} variant="A" />
  </div>`;
}

// ---------- wariant B ----------
function SlotCard({ s, z, hitSet, onRename }) {
  const members = team(z, s.id);
  const { drop, drag, cls } = useSlotDnd(s.id, members);
  // cała górna belka karty jest uchwytem zespołu
  return html`<div ref=${el => { drop.ref(el); drag.ref(el); }} className=${"slot" + (members.length ? "" : " empty") + cls + (drag.isDragging ? " dragging" : "")}>
    <div ref=${drag.handleRef} className="slot-h" style=${{ cursor: members.length ? "grab" : "default", touchAction: "none" }} tabIndex=${members.length ? 0 : -1} aria-label=${"Zespół " + label(s.id)}>
      <span className="t num">${s.time}</span><span className="cap num">${members.length ? members.length + "/" + MAX : "wolny"}</span>
    </div>
    ${members.map(m => html`<${Tile} key=${m.idx} idx=${m.idx} name=${m.name} hit=${hitSet.has(m.idx)} onRename=${onRename} />`)}
  </div>`;
}
function VariantB(p) {
  return html`<div className="B">
    ${DAYS.map((d, di) => html`<section className="row" key=${d}><h3>${d}</h3>
      <div className="strip">${SLOTS.filter(s => s.day === di).map(s => html`<${SlotCard} key=${s.id} s=${s} ...${p} />`)}</div></section>`)}
    <${Pool} ...${p} variant="B" />
  </div>`;
}

// ---------- wariant C ----------
function TeamCell({ s, z, hitSet, onRename }) {
  const members = team(z, s.id);
  const { drop, cls } = useSlotDnd(s.id, members);
  return html`<div ref=${drop.ref} className=${"team" + cls}>
    ${members.length ? members.map(m => html`<${Tile} key=${m.idx} idx=${m.idx} name=${m.name} hit=${hitSet.has(m.idx)} onRename=${onRename} />`) : html`<span className="muted">wolny</span>`}
  </div>`;
}
function MoveSelect({ labelText, options, onPick }) {
  return html`<select aria-label=${labelText} value="" onChange=${e => { if (e.target.value) onPick(e.target.value); }}>
    <option value="">${labelText}</option>
    ${options.map(o => html`<option key=${o.value} value=${o.value}>${o.label}</option>`)}
  </select>`;
}
function VariantC(p) {
  const { z, run } = p;
  const slotOpts = (filterFn) => SLOTS.filter(filterFn).map(s => ({ value: s.id, label: DAYS[s.day] + " " + s.time + " (" + team(z, s.id).length + "/" + MAX + ")" }));
  return html`<div className="C">
    <${Pool} ...${p} variant="C" />
    <table>
      <thead><tr><th>Dzień</th><th>Godzina</th><th>Zespół</th><th>Osoba</th><th>Cały zespół</th></tr></thead>
      <tbody>${SLOTS.map((s, i) => {
        const members = team(z, s.id);
        return html`<tr key=${s.id} className=${i && s.day !== SLOTS[i - 1].day ? "daystart" : ""}>
          <td>${s.day !== SLOTS[i - 1]?.day ? DAYS[s.day] : ""}</td>
          <td className="num">${s.time}</td>
          <td><${TeamCell} s=${s} ...${p} /></td>
          <td>${members.length ? html`<${MoveSelect} labelText="Przenieś osobę…" options=${members.flatMap(m => [
            ...slotOpts(x => x.id !== s.id && team(z, x.id).length < MAX).map(o => ({ value: "m|" + m.idx + "|" + o.value, label: m.name.split(" ")[1] + " → " + o.label })),
            { value: "r|" + m.idx, label: m.name.split(" ")[1] + " → usuń zapis" }])}
            onPick=${v => { const [k, idx, to] = v.split("|"); run(k === "m" ? { kind: "person-to-slot", idx, slot: to } : { kind: "person-remove", idx }); }} />` : ""}</td>
          <td>${members.length ? html`<${MoveSelect} labelText="Przenieś zespół…" options=${slotOpts(x => x.id !== s.id)}
            onPick=${to => run({ kind: "team-move", from: s.id, to })} />` : ""}</td>
        </tr>`;
      })}</tbody>
    </table>
  </div>`;
}

// ---------- aplikacja ----------
function App() {
  const [variant, setVariant] = useState(readV());
  const [z, setZ] = useState(initial);
  const [history, setHistory] = useState([]);
  const [toast, setToast] = useState(null);
  const [ask, setAsk] = useState(null); // { idx, slot }
  const [askName, setAskName] = useState("");
  const [filter, setFilter] = useState("");
  const [find, setFind] = useState("");
  const [log, setLog] = useState([]);
  const zRef = useRef(z); zRef.current = z;

  useEffect(() => {
    const on = () => setVariant(readV());
    window.addEventListener("hashchange", on);
    const key = e => { if (e.target.matches("input, select, textarea")) return; if (e.key === "ArrowLeft" && e.altKey) cycle(-1); if (e.key === "ArrowRight" && e.altKey) cycle(1); };
    window.addEventListener("keydown", key);
    return () => { window.removeEventListener("hashchange", on); window.removeEventListener("keydown", key); };
  }, []);
  const cycle = d => { const k = Object.keys(VARIANTS); const cur = readV(); location.hash = "v=" + k[(k.indexOf(cur) + d + k.length) % k.length]; };

  function run(op) {
    const r = apply(zRef.current, op);
    setLog(l => [JSON.stringify(op) + " → " + (r.error ? "ODRZUCONE" : r.needName ? "PYTA O NAZWISKO" : "OK"), ...l].slice(0, 8));
    if (r.error) { setToast({ text: r.error, bad: true }); return; }
    if (r.needName) { setAsk({ idx: op.idx, slot: op.slot }); setAskName(""); return; }
    if (r.next !== zRef.current) { setHistory(h => [zRef.current, ...h].slice(0, 20)); setZ(r.next); if (r.msg) setToast({ text: r.msg, undo: true }); }
  }
  const undo = () => { if (!history.length) return; setZ(history[0]); setHistory(h => h.slice(1)); setToast({ text: "Cofnięto" }); };
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), toast.undo ? 6000 : 4000); return () => clearTimeout(t); }, [toast]);

  function onDragEnd(event) {
    const { source, target } = event.operation;
    if (event.canceled || !source || !target) return;
    const sid = String(source.id), tid = String(target.id);
    if (sid.startsWith("p:")) {
      const idx = sid.slice(2);
      if (tid === "pool") return run({ kind: "person-remove", idx });
      if (tid.startsWith("pt:")) return tid.slice(3) === idx ? null : run({ kind: "person-swap", a: idx, b: tid.slice(3) });
      if (tid.startsWith("s:")) return run({ kind: "person-to-slot", idx, slot: tid.slice(2) });
    }
    if (sid.startsWith("t:")) {
      const from = sid.slice(2);
      let to = null;
      if (tid.startsWith("s:")) to = tid.slice(2);
      if (tid.startsWith("pt:")) to = zRef.current[tid.slice(3)]?.slot;
      if (to) run({ kind: "team-move", from, to });
    }
  }

  const q = find.trim().toLowerCase();
  const hitSet = new Set(q ? Object.entries(z).filter(([i, v]) => i.includes(q) || v.name.toLowerCase().includes(q)).map(([i]) => i).concat(LIST.filter(i => !z[i] && i.includes(q))) : []);
  const enrolledCount = Object.keys(z).length;
  const capacity = SLOTS.length * MAX;
  const freeSlots = SLOTS.filter(s => team(z, s.id).length === 0).length;
  const props = { z, filter, setFilter, hitSet, run, onRename: (idx, name) => run({ kind: "rename", idx, name }) };
  const V = { A: VariantA, B: VariantB, C: VariantC }[variant];

  return html`<${DragDropProvider} onDragEnd=${onDragEnd}>
    <header className="top">
      <div><h1>Mechanika płynów — kolokwium zaliczeniowe</h1><span className="muted">Tablica zapisów</span></div>
      <div className="stats">
        <div><b className="num">${enrolledCount}/${LIST.length}</b><span>zapisanych indeksów</span></div>
        <div><b className="num">${freeSlots}</b><span>wolnych slotów</span></div>
        <div><b className="num">${capacity}</b><span>miejsc łącznie</span></div>
      </div>
      ${capacity < LIST.length && html`<div className="warnline">Miejsc jest o ${LIST.length - capacity} mniej niż indeksów.</div>`}
      <input className="search" placeholder="Znajdź indeks albo nazwisko" value=${find} onInput=${e => setFind(e.target.value)} />
    </header>
    <${V} ...${props} />
    ${ask && html`<div className="dlg-bg"><form className="dlg" onSubmit=${e => { e.preventDefault(); if (!askName.trim()) return; setHistory(h => [zRef.current, ...h]); const r = apply(zRef.current, { kind: "manual", idx: ask.idx, slot: ask.slot, name: askName.trim() }); if (r.error) setToast({ text: r.error, bad: true }); else { setZ(r.next); setToast({ text: r.msg, undo: true }); } setAsk(null); }}>
      <h2>Ręczny zapis indeksu ${ask.idx}</h2>
      <p className="muted" style=${{ margin: "0 0 .4rem" }}>${label(ask.slot)}</p>
      <label>Imię i nazwisko<input autoFocus value=${askName} onInput=${e => setAskName(e.target.value)} /></label>
      <div className="row-btns"><button type="button" className="btn q" onClick=${() => setAsk(null)}>Anuluj</button><button className="btn">Zapisz</button></div>
    </form></div>`}
    ${toast && html`<div className=${"toast" + (toast.bad ? " bad" : "")} role="status"><span>${toast.text}</span>${toast.undo && html`<button onClick=${undo}>Cofnij</button>`}</div>`}
    <div id="proto">
      <button onClick=${() => cycle(-1)} aria-label="Poprzedni wariant">←</button>
      <span>${variant} — ${VARIANTS[variant]}</span>
      <button onClick=${() => cycle(1)} aria-label="Następny wariant">→</button>
      <span className="hint" title="Alt+← / Alt+→ przełącza warianty (same strzałki zostają dla klawiatury dnd-kit). Klawiatura: Tab do kafelka, Spacja podnosi, strzałki przesuwają, Spacja upuszcza, Esc anuluje. Uchwyt ⠿ (w B: nagłówek karty) przenosi cały zespół.">?</span>
    </div>
    <pre id="log">${"ostatnie operacje:\n" + (log.join("\n") || "—")}</pre>
  </${DragDropProvider}>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
