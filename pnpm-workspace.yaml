saveExact: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - prisma@7.10.1

allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  msw: false
  "@prisma/engines": true
  prisma: true
  cpu-features: false
  protobufjs: false
  ssh2: false
